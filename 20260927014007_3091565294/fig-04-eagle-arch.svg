<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" role="img" aria-label="EAGLE 草稿模型结构：拼接 token embedding 与目标模型特征，一次输出特征与 token 分布">
  <style>
    .h    { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:14.5px; font-weight:600; fill:#0f172a; }
    .h2   { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:12.5px; font-weight:600; fill:#1e293b; }
    .lbl  { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:11.5px; fill:#334155; }
    .lbls { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:10.5px; fill:#64748b; }
    .mono { font-family:Consolas,Cascadia Mono,monospace; font-size:11px; fill:#0f172a; }
    .monos{ font-family:Consolas,Cascadia Mono,monospace; font-size:10px; fill:#64748b; }
  </style>
  <defs>
    <marker id="f4a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="f4p" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="f4b" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>

  <text class="h" x="16" y="30">EAGLE 的草稿模型：输入「token embedding ⊕ 目标模型特征」，同时输出「下一个特征 ⊕ 下一个 token 分布」</text>

  <!-- ================= panel A: target model ================= -->
  <rect x="16" y="46" width="286" height="276" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="h2" x="34" y="72">目标模型 Mp（冻结，不改动）</text>
  <text class="lbls" x="34" y="90">标准自回归 Transformer，共 N 层</text>

  <rect x="52" y="98" width="214" height="30" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="lbl" x="159" y="118" text-anchor="middle">LM Head → logits → p(·)</text>

  <rect x="52" y="138" width="214" height="42" rx="7" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text class="lbl" x="159" y="156" text-anchor="middle" font-weight="600" fill="#5b21b6">h_t：最后一层的输出</text>
  <text class="lbls" x="159" y="172" text-anchor="middle" fill="#5b21b6">← 特征 f_t 就从这里取</text>

  <rect x="52" y="190" width="214" height="30" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="lbls" x="159" y="210" text-anchor="middle">Layer N（最后一层 Transformer）</text>
  <rect x="52" y="228" width="214" height="24" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="lbls" x="159" y="244" text-anchor="middle">⋮ 中间层</text>
  <rect x="52" y="260" width="214" height="30" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="lbls" x="159" y="280" text-anchor="middle">Layer 1 ← 输入 x₁…x_t</text>

  <line x1="266" y1="159" x2="300" y2="159" stroke="#7c3aed" stroke-width="2" marker-end="url(#f4p)"/>
  <text class="monos" x="283" y="152" text-anchor="middle" fill="#7c3aed">f_t</text>

  <text class="lbls" x="34" y="304">论文叫它 second-to-top-layer feature，</text>
  <text class="lbls" x="34" y="320">即 LM Head 的输入 h_t（不是倒数第二层）。</text>

  <!-- ================= panel B: eagle draft ================= -->
  <rect x="316" y="46" width="568" height="276" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text class="h2" x="334" y="72">EAGLE 草稿模型 Mq（要训练的只有这一小块）</text>
  <text class="lbls" x="334" y="90">一个 FC + 一层 decoder；Embedding 与 LM Head 直接复用目标模型、保持冻结</text>

  <rect x="334" y="110" width="150" height="40" rx="7" fill="#ffffff" stroke="#f59e0b"/>
  <text class="lbl" x="409" y="127" text-anchor="middle">embed(x_{t+1})</text>
  <text class="monos" x="409" y="143" text-anchor="middle">d 维</text>

  <rect x="334" y="160" width="150" height="40" rx="7" fill="#ede9fe" stroke="#a78bfa"/>
  <text class="lbl" x="409" y="177" text-anchor="middle">f_t（目标模型给的）</text>
  <text class="monos" x="409" y="193" text-anchor="middle">d 维</text>

  <line x1="490" y1="130" x2="516" y2="152" stroke="#475569" stroke-width="1.8" marker-end="url(#f4a)"/>
  <line x1="490" y1="180" x2="516" y2="160" stroke="#475569" stroke-width="1.8" marker-end="url(#f4a)"/>
  <rect x="520" y="135" width="86" height="42" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text class="lbl" x="563" y="153" text-anchor="middle">拼接</text>
  <text class="mono" x="563" y="169" text-anchor="middle">[2d]</text>

  <line x1="612" y1="156" x2="632" y2="156" stroke="#475569" stroke-width="1.8" marker-end="url(#f4a)"/>
  <rect x="636" y="135" width="120" height="42" rx="7" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="lbl" x="696" y="153" text-anchor="middle">FC 投影</text>
  <text class="mono" x="696" y="169" text-anchor="middle">2d → d</text>

  <rect x="520" y="198" width="236" height="42" rx="7" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text class="lbl" x="638" y="216" text-anchor="middle" font-weight="600">1 × Decoder Layer</text>
  <text class="monos" x="638" y="232" text-anchor="middle">因果自注意力（带 KV Cache）+ FFN</text>
  <line x1="696" y1="179" x2="696" y2="196" stroke="#475569" stroke-width="1.8" marker-end="url(#f4a)"/>

  <line x1="638" y1="242" x2="638" y2="262" stroke="#475569" stroke-width="1.8" marker-end="url(#f4a)"/>
  <rect x="334" y="266" width="230" height="36" rx="7" fill="#ede9fe" stroke="#a78bfa"/>
  <text class="lbl" x="449" y="289" text-anchor="middle">Feature Head：FC → f̂_{t+1}</text>
  <rect x="576" y="266" width="230" height="36" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="lbl" x="691" y="289" text-anchor="middle">LM Head（共享）→ p_{t+2}</text>
  <line x1="600" y1="258" x2="470" y2="264" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#f4p)"/>
  <line x1="676" y1="258" x2="690" y2="264" stroke="#93c5fd" stroke-width="1.8" marker-end="url(#f4b)"/>

  <!-- ================= bottom: training + recurrence ================= -->
  <rect x="16" y="330" width="868" height="152" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="h2" x="34" y="356">自回归展开：每一步都「吃掉一个 token + 一个特征」，吐出「下一个特征 + 下下个 token 分布」</text>

  <rect x="34" y="370" width="392" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="mono" x="50" y="392">step 1  →  ( embed(x_{t+1}) , f_t )</text>
  <text class="mono" x="50" y="414" fill="#7c3aed">├─ 输出 f̂_{t+1}（预测的特征）</text>
  <text class="mono" x="50" y="434" fill="#1d4ed8">└─ 输出 p_{t+2} → 采样出草稿 token x_{t+2}</text>
  <text class="lbls" x="50" y="456">x_{t+1} 是已知的真 token（上一轮验证的产物）</text>

  <rect x="442" y="370" width="424" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="mono" x="458" y="392">step 2  →  ( embed(x_{t+2}) , f̂_{t+1} )</text>
  <text class="mono" x="458" y="414" fill="#7c3aed">├─ 输出 f̂_{t+2}（由草稿模型自己猜的特征）</text>
  <text class="mono" x="458" y="434" fill="#1d4ed8">└─ 输出 p_{t+3} → 采样出草稿 token x_{t+3}</text>
  <text class="lbls" x="458" y="456">训练时会对输入特征注入 U(−0.1, 0.1) 噪声，模拟这种漂移</text>

  <!-- ================= key note ================= -->
  <rect x="16" y="496" width="868" height="88" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="h2" x="34" y="522">关键：token 比特征「超前一步」</text>
  <text class="lbl" x="34" y="546">预测 f_{t+1} 时，如果只知道 f_t，那么 f_{t+1} 到底对应哪个 token 是不确定的（可能是 am，也可能是 always），特征因此无法确定。</text>
  <text class="lbl" x="34" y="568">EAGLE 把 x_{t+1}（已经确定的那个 token）一起喂进来，不确定性被消解 —— 这正是论文标题里 Feature Uncertainty 的含义。</text>
</svg>
