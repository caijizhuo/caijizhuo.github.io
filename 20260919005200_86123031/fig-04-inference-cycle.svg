<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">一个推理周期：draft → verify → accept → rewind</text>
  <text x="480" y="62" text-anchor="middle" font-size="13.5" fill="#6b7280">例子：「中国的首都是」，块大小 B = 8（1 个 anchor a + 7 个 mask）</text>

  <defs>
    <marker id="m4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- STEP 1 -->
  <rect x="36" y="84" width="592" height="80" rx="11" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6"/>
  <text x="54" y="108" font-size="14" font-weight="700" fill="#92400e">① target 前向：产出 anchor a + 缓存 L 层隐状态</text>
  <text x="54" y="128" font-size="11" fill="#92400e">这一步不是额外开销 —— 目标模型本来就要生成下一个 token</text>
  <g font-size="11">
    <rect x="54" y="136" width="42" height="20" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="75" y="151" text-anchor="middle" fill="#78350f">…是</text>
    <rect x="104" y="136" width="42" height="20" rx="4" fill="#4ade80" stroke="#15803d" stroke-width="1.6"/>
    <text x="125" y="151" text-anchor="middle" font-weight="700" fill="#14532d">北</text>
    <text x="158" y="151" font-size="10.5" fill="#15803d">← a</text>
    <text x="260" y="151" font-size="10.5" fill="#92400e">同时缓存 H⁽ˡ¹⁾ … H⁽ˡᴸ⁾</text>
  </g>

  <path d="M332 168 L332 186" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m4)"/>

  <!-- STEP 2 -->
  <rect x="36" y="190" width="592" height="126" rx="11" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="54" y="214" font-size="14" font-weight="700" fill="#312e81">② draft：一次前向填满整块</text>
  <text x="54" y="234" font-size="11" fill="#4338ca">Q 来自 H_b；K/V = [W_c^K·H_c ; W_b^K·H_b] 与 [W_c^V·H_c ; W_b^V·H_b]，块内双向可见</text>

  <g font-size="11">
    <rect x="54" y="246" width="42" height="24" rx="4" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/>
    <text x="75" y="263" text-anchor="middle" font-weight="700" fill="#14532d">北</text>
    <g fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2">
      <rect x="102" y="246" width="42" height="24" rx="4"/>
      <rect x="150" y="246" width="42" height="24" rx="4"/>
      <rect x="198" y="246" width="42" height="24" rx="4"/>
      <rect x="246" y="246" width="42" height="24" rx="4"/>
      <rect x="294" y="246" width="42" height="24" rx="4"/>
      <rect x="342" y="246" width="42" height="24" rx="4"/>
      <rect x="390" y="246" width="42" height="24" rx="4"/>
    </g>
    <g font-size="8.5" fill="#6b7280" text-anchor="middle">
      <text x="123" y="262">MASK</text><text x="171" y="262">MASK</text><text x="219" y="262">MASK</text>
      <text x="267" y="262">MASK</text><text x="315" y="262">MASK</text><text x="363" y="262">MASK</text>
      <text x="411" y="262">MASK</text>
    </g>
  </g>
  <rect x="54" y="278" width="390" height="26" rx="6" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="249" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#312e81">DFlash draft · N 层 · 1 次 forward</text>

  <g font-size="11" fill="#14532d">
    <rect x="470" y="246" width="42" height="24" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="491" y="263" text-anchor="middle" font-weight="700">京</text>
    <rect x="518" y="246" width="42" height="24" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="539" y="263" text-anchor="middle" font-weight="700">是</text>
    <rect x="566" y="246" width="42" height="24" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="587" y="263" text-anchor="middle" font-weight="700">中</text>
  </g>
  <text x="642" y="234" text-anchor="end" font-size="10.5" fill="#15803d">B−1 = 7 个候选同时产出</text>

  <path d="M332 318 L332 336" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m4)"/>

  <!-- STEP 3 -->
  <rect x="36" y="340" width="592" height="118" rx="11" fill="#f4faf6" stroke="#16a34a" stroke-width="1.6"/>
  <text x="54" y="364" font-size="14" font-weight="700" fill="#15803d">③ verify：目标模型一次并行前向，得到每个位置的真实分布</text>

  <g font-size="11">
    <rect x="54" y="378" width="42" height="26" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="75" y="396" text-anchor="middle" font-weight="700" fill="#14532d">北</text>
    <rect x="102" y="378" width="42" height="26" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="123" y="396" text-anchor="middle" font-weight="700" fill="#14532d">京</text>
    <rect x="150" y="378" width="42" height="26" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="171" y="396" text-anchor="middle" font-weight="700" fill="#14532d">是</text>
    <rect x="198" y="378" width="42" height="26" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="219" y="396" text-anchor="middle" font-weight="700" fill="#14532d">中</text>
    <rect x="246" y="378" width="42" height="26" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="267" y="396" text-anchor="middle" font-weight="700" fill="#14532d">国</text>
    <rect x="294" y="378" width="42" height="26" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="315" y="396" text-anchor="middle" font-weight="700" fill="#14532d">的</text>
    <rect x="342" y="378" width="42" height="26" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="363" y="396" text-anchor="middle" font-weight="700" fill="#14532d">首</text>
    <rect x="390" y="378" width="42" height="26" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/>
    <text x="411" y="396" text-anchor="middle" font-weight="700" fill="#14532d">都</text>
    <rect x="438" y="378" width="42" height="26" rx="4" fill="#fcd34d" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="459" y="396" text-anchor="middle" font-weight="700" fill="#78350f">。</text>
  </g>
  <text x="494" y="396" font-size="10.5" fill="#b45309">← bonus token</text>
  <text x="54" y="428" font-size="11" fill="#166534">从左往右取最长一致前缀；首个不一致位置用目标分布重采样（保证无损）；末位顺带产出 bonus</text>
  <text x="54" y="448" font-size="11" font-weight="700" fill="#15803d">全对时一轮新增 τ = B 个 token，只花 1 次目标前向</text>

  <!-- STEP 4 -->
  <rect x="36" y="472" width="592" height="88" rx="11" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.6"/>
  <text x="54" y="496" font-size="14" font-weight="700" fill="#374151">④ rewind：清掉被拒草稿的 KV 条目</text>
  <text x="54" y="518" font-size="11" fill="#4b5563">被拒 token 已在草稿与目标两侧的 KV cache 里留下条目，不回滚会污染下一轮上下文</text>
  <text x="54" y="540" font-size="11" fill="#4338ca">工程要点（SGLang 实现）：H_c 提前投影并物化，不缓存原始隐状态，且可被前缀相同的请求共享</text>

  <!-- RIGHT: accounting -->
  <rect x="648" y="84" width="286" height="196" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.7"/>
  <text x="791" y="112" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3730a3">一轮的成本账</text>
  <g font-size="12">
    <text x="670" y="140" fill="#374151">目标前向</text>
    <text x="812" y="140" font-weight="700" fill="#b45309">1 次</text>
    <text x="670" y="170" fill="#374151">草稿前向</text>
    <text x="812" y="170" font-weight="700" fill="#15803d">1 次</text>
    <text x="670" y="200" fill="#374151">接受长度 τ</text>
    <text x="812" y="200" font-weight="700" fill="#15803d">1 ≤ τ ≤ B</text>
  </g>
  <line x1="670" y1="216" x2="912" y2="216" stroke="#c7d2fe" stroke-width="1.3"/>
  <text x="670" y="240" font-size="11.5" fill="#4338ca">逐字解码需 τ 次目标前向</text>
  <text x="670" y="264" font-size="11.5" font-weight="700" fill="#15803d">加速 ≈ t_target / (T_draft + T_verify / τ)</text>

  <!-- RIGHT: acceptance -->
  <rect x="648" y="296" width="286" height="264" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.7"/>
  <text x="791" y="324" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">接受长度是随机的</text>
  <text x="670" y="350" font-size="11.5" fill="#78350f">草稿不一定全对，每轮实际新增的</text>
  <text x="670" y="370" font-size="11.5" fill="#78350f">token 数就是 τ 的期望值</text>

  <text x="670" y="400" font-size="12" font-weight="700" fill="#78350f">情况 A：7 个候选中 6 个被接受</text>
  <g font-size="11">
    <rect x="670" y="410" width="180" height="14" rx="3" fill="#4ade80"/>
    <rect x="854" y="410" width="20" height="14" rx="3" fill="#fca5a5"/>
    <rect x="878" y="410" width="30" height="14" rx="3" fill="#fcd34d"/>
    <text x="670" y="440" font-size="10.5" fill="#15803d">绿 = 接受　红 = 拒绝　黄 = 重采样 / bonus</text>
  </g>
  <text x="670" y="466" font-size="11.5" fill="#15803d">被拒位置用目标分布重采样</text>
  <text x="670" y="486" font-size="11.5" fill="#15803d">末位仍可白得 1 个 bonus token</text>

  <line x1="670" y1="500" x2="912" y2="500" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="670" y="524" font-size="11.5" font-weight="700" fill="#b45309">猜错只损失「本可多赚的」</text>
  <text x="670" y="544" font-size="11.5" font-weight="700" fill="#b45309">不会改变输出分布</text>
</svg>
