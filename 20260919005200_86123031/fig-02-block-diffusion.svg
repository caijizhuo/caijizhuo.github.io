<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">块扩散草稿：一次性解出整块 mask</text>
  <text x="480" y="62" text-anchor="middle" font-size="13.5" fill="#6b7280">这是「为什么能一次猜好几个」的核心 —— 用掩码 + 块内双向注意力把生成变成一次性填充</text>

  <!-- ===== LEFT COLUMN ===== -->
  <text x="46" y="102" font-size="15" font-weight="700" fill="#111827">① 构造输入块（长度 B）</text>
  <text x="46" y="124" font-size="12" fill="#4b5563">第 0 位放 anchor a（上一轮目标模型产出的、已验证正确的 token），其余 B−1 位放 mask</text>

  <g>
    <rect x="46" y="140" width="72" height="46" rx="7" fill="#4ade80" stroke="#15803d" stroke-width="1.8"/>
    <text x="82" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">a</text>
    <text x="82" y="178" text-anchor="middle" font-size="9.5" fill="#14532d">anchor</text>
    <g fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3">
      <rect x="126" y="140" width="72" height="46" rx="7"/>
      <rect x="206" y="140" width="72" height="46" rx="7"/>
      <rect x="286" y="140" width="72" height="46" rx="7"/>
    </g>
    <g font-size="10.5" fill="#6b7280" text-anchor="middle">
      <text x="162" y="168">[MASK]</text><text x="242" y="168">[MASK]</text><text x="322" y="168">[MASK]</text>
    </g>
  </g>

  <text x="46" y="216" font-size="12.5" font-weight="700" fill="#3730a3">Q 只来自块内；K/V 由「目标上下文特征 ⊕ 块内嵌入」拼接而成</text>
  <text x="46" y="238" font-size="12" fill="#4b5563">块内双向可见 ⇒ B−1 个位置互为条件、同时求解</text>
  <text x="46" y="258" font-size="12" fill="#4b5563">目标特征作为额外的 KV 条目常驻，不参与 Q</text>

  <text x="46" y="296" font-size="15" font-weight="700" fill="#111827">② 注意力模式（推理时）</text>

  <g font-size="11.5">
    <text x="212" y="308" text-anchor="middle" fill="#b45309">目标上下文 K/V</text>
    <text x="418" y="308" text-anchor="middle" fill="#15803d">块内 K/V</text>
    <g fill="#6b7280" text-anchor="middle" font-size="10">
      <text x="130" y="330">c₁</text><text x="162" y="330">c₂</text><text x="194" y="330">c₃</text>
      <text x="290" y="330">a</text><text x="338" y="330">m₁</text><text x="386" y="330">m₂</text>
      <text x="434" y="330">m₃</text><text x="482" y="330">m₄</text>
    </g>
    <g fill="#6b7280" text-anchor="end" font-size="10">
      <text x="110" y="360">Q: a</text><text x="110" y="388">Q: m₁</text>
      <text x="110" y="416">Q: m₂</text><text x="110" y="444">Q: m₃</text><text x="110" y="472">Q: m₄</text>
    </g>
  </g>

  <g font-size="13.5" text-anchor="middle">
    <g fill="#d97706">
      <text x="130" y="360">✓</text><text x="162" y="360">✓</text><text x="194" y="360">✓</text>
      <text x="130" y="388">✓</text><text x="162" y="388">✓</text><text x="194" y="388">✓</text>
      <text x="130" y="416">✓</text><text x="162" y="416">✓</text><text x="194" y="416">✓</text>
      <text x="130" y="444">✓</text><text x="162" y="444">✓</text><text x="194" y="444">✓</text>
      <text x="130" y="472">✓</text><text x="162" y="472">✓</text><text x="194" y="472">✓</text>
    </g>
    <g fill="#16a34a">
      <text x="290" y="360">✓</text><text x="338" y="360">✓</text><text x="386" y="360">✓</text><text x="434" y="360">✓</text><text x="482" y="360">✓</text>
      <text x="290" y="388">✓</text><text x="338" y="388">✓</text><text x="386" y="388">✓</text><text x="434" y="388">✓</text><text x="482" y="388">✓</text>
      <text x="290" y="416">✓</text><text x="338" y="416">✓</text><text x="386" y="416">✓</text><text x="434" y="416">✓</text><text x="482" y="416">✓</text>
      <text x="290" y="444">✓</text><text x="338" y="444">✓</text><text x="386" y="444">✓</text><text x="434" y="444">✓</text><text x="482" y="444">✓</text>
      <text x="290" y="472">✓</text><text x="338" y="472">✓</text><text x="386" y="472">✓</text><text x="434" y="472">✓</text><text x="482" y="472">✓</text>
    </g>
  </g>
  <line x1="230" y1="316" x2="230" y2="482" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="110" y1="338" x2="510" y2="338" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="280" y="508" text-anchor="middle" font-size="11.5" fill="#6b7280">推理时无因果掩码：块内任意位置都能看到块内全部位置</text>

  <!-- ===== RIGHT COLUMN ===== -->
  <rect x="548" y="88" width="382" height="206" rx="13" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.7"/>
  <text x="739" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">③ 一次前向 → B−1 个候选</text>

  <g font-size="12" fill="#14532d">
    <rect x="574" y="136" width="54" height="38" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.4"/>
    <text x="601" y="161" text-anchor="middle" font-weight="700">京</text>
    <rect x="636" y="136" width="54" height="38" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.4"/>
    <text x="663" y="161" text-anchor="middle" font-weight="700">是</text>
    <rect x="698" y="136" width="54" height="38" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.4"/>
    <text x="725" y="161" text-anchor="middle" font-weight="700">中</text>
    <rect x="760" y="136" width="54" height="38" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.4"/>
    <text x="787" y="161" text-anchor="middle" font-weight="700">国</text>
    <rect x="822" y="136" width="54" height="38" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.4"/>
    <text x="849" y="161" text-anchor="middle" font-weight="700">的</text>
  </g>
  <text x="739" y="198" text-anchor="middle" font-size="11.5" fill="#4338ca">用共享的目标 LM head 解码，逐位置独立给出</text>
  <text x="739" y="222" text-anchor="middle" font-size="11.5" fill="#4338ca">anchor 这一位本身不需要预测，只作为条件</text>
  <line x1="574" y1="238" x2="904" y2="238" stroke="#c7d2fe" stroke-width="1.3"/>
  <text x="739" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">所有 mask 位置在同一次前向内一起解出</text>
  <text x="739" y="282" text-anchor="middle" font-size="11" fill="#6b7280">（因此不存在「多步去噪」的迭代过程）</text>

  <!-- why it works -->
  <rect x="548" y="308" width="382" height="200" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.7"/>
  <text x="739" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">为什么这样就「能一次猜好几个」</text>
  <text x="566" y="366" font-size="11.5" fill="#78350f">自回归：token 之间是函数依赖关系</text>
  <text x="566" y="388" font-size="11.5" fill="#78350f">第 k 个依赖第 k−1 个的输出 → 必须串行</text>
  <line x1="566" y1="402" x2="912" y2="402" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="566" y="426" font-size="11.5" fill="#78350f">扩散：mask 位置之间没有依赖，</text>
  <text x="566" y="448" font-size="11.5" fill="#78350f">只有「共同的条件」</text>
  <text x="566" y="476" font-size="11.5" font-weight="700" fill="#15803d">⇒ 同一份条件下，所有位置可同时求解</text>
  <text x="566" y="498" font-size="10.5" fill="#6b7280">代价：各位置互相「不商量」，需靠块内注意力兜底</text>
</svg>
