<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" role="img" aria-label="EAGLE-1 的静态草稿树与 EAGLE-2 的动态草稿树对比">
  <style>
    .h    { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:14.5px; font-weight:600; fill:#0f172a; }
    .h2   { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:12.5px; font-weight:600; fill:#1e293b; }
    .lbl  { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:12px; fill:#334155; }
    .lbls { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:11px; fill:#64748b; }
    .node { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; font-size:11px; font-weight:600; fill:#0f172a; }
    .cf   { font-family:Consolas,Cascadia Mono,monospace; font-size:9px; fill:#b45309; }
    .waste{ font-family:Consolas,Cascadia Mono,monospace; font-size:9px; fill:#94a3b8; }
    .stepn{ font-family:Consolas,Cascadia Mono,monospace; font-size:11px; font-weight:700; fill:#1d4ed8; }
  </style>
  <rect width="900" height="540" fill="#ffffff"/>

  <!-- ================= left: static tree ================= -->
  <rect x="16" y="16" width="424" height="352" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="h" x="34" y="44">EAGLE-1：静态树（每一层都铺 top-2）</text>
  <text class="lbls" x="34" y="64">形状固定，与上下文无关</text>

  <g stroke="#cbd5e1" stroke-width="1.5" fill="none">
    <path d="M228 84 L166 116"/><path d="M228 84 L290 116"/>
    <path d="M166 144 L128 176"/><path d="M166 144 L204 176"/>
    <path d="M290 144 L252 176"/><path d="M290 144 L328 176"/>
    <path d="M128 204 L110 236"/><path d="M128 204 L146 236"/>
    <path d="M328 204 L310 236"/><path d="M328 204 L346 236"/>
  </g>

  <rect x="200" y="58" width="56" height="26" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="node" x="228" y="75" text-anchor="middle">root</text>

  <rect x="138" y="116" width="56" height="28" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.8"/>
  <text class="node" x="166" y="129" text-anchor="middle">北京</text>
  <text class="cf"   x="166" y="140" text-anchor="middle">.71</text>

  <rect x="262" y="116" width="56" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="node" x="290" y="129" text-anchor="middle">一座</text>
  <text class="cf"   x="290" y="140" text-anchor="middle">.12</text>

  <rect x="100" y="176" width="56" height="28" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.8"/>
  <text class="node" x="128" y="189" text-anchor="middle">是</text>
  <text class="cf"   x="128" y="200" text-anchor="middle">.66</text>

  <rect x="176" y="176" width="56" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="node" x="204" y="189" text-anchor="middle">的</text>
  <text class="cf"   x="204" y="200" text-anchor="middle">.09</text>

  <rect x="224" y="176" width="56" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="node" x="252" y="189" text-anchor="middle">位于</text>
  <text class="cf"   x="252" y="200" text-anchor="middle">.05</text>

  <rect x="300" y="176" width="56" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="node" x="328" y="189" text-anchor="middle">是</text>
  <text class="cf"   x="328" y="200" text-anchor="middle">.04</text>

  <rect x="82" y="236" width="56" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text class="node" x="110" y="249" text-anchor="middle" fill="#94a3b8">是</text>
  <text class="waste" x="110" y="260" text-anchor="middle">.52×.09</text>

  <rect x="118" y="236" width="56" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text class="node" x="146" y="249" text-anchor="middle" fill="#94a3b8">中国</text>
  <text class="waste" x="146" y="260" text-anchor="middle">.30×.09</text>

  <rect x="282" y="236" width="56" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text class="node" x="310" y="249" text-anchor="middle" fill="#94a3b8">的</text>
  <text class="waste" x="310" y="260" text-anchor="middle">.02</text>

  <rect x="346" y="236" width="56" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text class="node" x="374" y="249" text-anchor="middle" fill="#94a3b8">在</text>
  <text class="waste" x="374" y="260" text-anchor="middle">.01</text>

  <text class="lbls" x="34" y="296">示意：11 个节点、深度 3。低置信度分支（虚线）照样占用预算，</text>
  <text class="lbls" x="34" y="314">它们几乎必然被拒绝，等于白发了一个「验证名额」。</text>
  <text class="lbl"  x="34" y="340">论文的例子：10+2= 后面几乎必然是 1，静态树仍为它铺 2 个候选；</text>
  <text class="lbl"  x="34" y="358">而 10+2 很难 —— 动态树才会在这里多分配节点。</text>

  <!-- ================= right: dynamic tree ================= -->
  <rect x="460" y="16" width="424" height="352" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text class="h" x="478" y="44">EAGLE-2：动态树（按置信度分配节点）</text>
  <text class="lbls" x="478" y="64">同样的预算，投给高置信度路径</text>

  <g stroke="#86efac" stroke-width="1.5" fill="none">
    <path d="M672 80 L640 104"/><path d="M672 80 L704 104"/>
    <path d="M640 132 L616 152"/><path d="M640 132 L664 152"/>
    <path d="M616 180 L596 200"/><path d="M616 180 L636 200"/>
    <path d="M596 228 L578 248"/><path d="M596 228 L614 248"/>
    <path d="M578 276 L562 296"/><path d="M578 276 L594 296"/>
  </g>
  <path d="M704 132 L716 150" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="648" y="56" width="48" height="24" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="node" x="672" y="72" text-anchor="middle">root</text>

  <rect x="616" y="104" width="48" height="28" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.8"/>
  <text class="node" x="640" y="117" text-anchor="middle">北京</text>
  <text class="cf"   x="640" y="128" text-anchor="middle">.71</text>

  <rect x="680" y="104" width="48" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text class="node" x="704" y="117" text-anchor="middle" fill="#94a3b8">一座</text>
  <text class="waste" x="704" y="128" text-anchor="middle">.12 剪掉</text>

  <rect x="592" y="152" width="48" height="28" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.8"/>
  <text class="node" x="616" y="165" text-anchor="middle">是</text>
  <text class="cf"   x="616" y="176" text-anchor="middle">.66</text>

  <rect x="640" y="152" width="48" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text class="node" x="664" y="165" text-anchor="middle" fill="#94a3b8">的</text>
  <text class="waste" x="664" y="176" text-anchor="middle">.09</text>

  <rect x="572" y="200" width="48" height="28" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.8"/>
  <text class="node" x="596" y="213" text-anchor="middle">中国</text>
  <text class="cf"   x="596" y="224" text-anchor="middle">.48</text>

  <rect x="612" y="200" width="48" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="node" x="636" y="213" text-anchor="middle">一座</text>
  <text class="cf"   x="636" y="224" text-anchor="middle">.21</text>

  <rect x="554" y="248" width="48" height="28" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.8"/>
  <text class="node" x="578" y="261" text-anchor="middle">的</text>
  <text class="cf"   x="578" y="272" text-anchor="middle">.41</text>

  <rect x="590" y="248" width="48" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="node" x="614" y="261" text-anchor="middle">市</text>
  <text class="cf"   x="614" y="272" text-anchor="middle">.33</text>

  <rect x="538" y="296" width="48" height="28" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.8"/>
  <text class="node" x="562" y="309" text-anchor="middle">是</text>
  <text class="cf"   x="562" y="320" text-anchor="middle">.55</text>

  <rect x="570" y="296" width="48" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="node" x="594" y="309" text-anchor="middle">中国</text>
  <text class="cf"   x="594" y="320" text-anchor="middle">.28</text>

  <rect x="700" y="240" width="164" height="60" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text class="lbls" x="712" y="260">同样是 11 个节点，</text>
  <text class="lbls" x="712" y="278">但深度从 3 增加到 5，</text>
  <text class="lbls" x="712" y="294">期望接受长度更长。</text>

  <text class="lbls" x="478" y="342">真实配置（论文附录 A）：树总节点预算 60（7B/8B）、50（13B）、</text>
  <text class="lbls" x="478" y="360">48（70B），深度 6，每轮固定扩张置信度最高的 top-10 个节点。</text>

  <!-- ================= bottom: algorithm ================= -->
  <rect x="16" y="384" width="868" height="142" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text class="h2" x="34" y="412">EAGLE-2 的动态建树：为什么「贪心按置信度投节点」几乎是最优的</text>

  <text class="stepn" x="34" y="438">1</text>
  <text class="lbl"  x="52" y="438">草稿模型对每个候选输出置信度（softmax 概率）。实测：置信度 &lt; 0.05 的候选真实接受率 ≈ 0.04，&gt; 0.95 的 ≈ 0.98。</text>
  <text class="stepn" x="34" y="462">2</text>
  <text class="lbl"  x="52" y="462">给每个节点打分：score = 从 root 到该节点路径上所有置信度之积 ≈ 整条路径全部被接受的概率。</text>
  <text class="stepn" x="34" y="486">3</text>
  <text class="lbl"  x="52" y="486">在「整棵树」里挑 score 最高的若干个节点去扩张（而不是只扩张最新一层），得到新一层候选。</text>
  <text class="stepn" x="34" y="510">4</text>
  <text class="lbl"  x="52" y="510">节点数超过预算就全局剪枝掉 score 最低的；随后照旧交给目标模型一次前向验证。</text>
</svg>
